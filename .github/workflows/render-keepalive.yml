name: Keep Render Service Awake 24/7

on:
  schedule:
    # Run every 10 minutes (Render free tier sleeps after 15 minutes of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Terra_vault Keep-Alive Endpoint
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL || 'https://terra-vault.onrender.com' }}
        run: |
          echo "Sending Keep-Alive ping to: $RENDER_APP_URL/api/keep-alive"
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" "$RENDER_APP_URL/api/keep-alive" || echo "000")
          echo "HTTP Response Status: $HTTP_STATUS"
          if [ -f response.json ]; then
            cat response.json
            echo ""
          fi
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✓ Render service is ALIVE and awake."
          else
            echo "⚠️ Non-200 response ($HTTP_STATUS) — ping sent to wake up instance."
          fi
