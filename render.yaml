# Render Blueprint Specification for Terra_vault
# https://render.com/docs/blueprint-spec

version: "1"

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Backend FastAPI Service (Dockerized with Tesseract, OpenCV & PyTorch ML libs)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: terravault-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /docs
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: terravault-db
          property: connectionString
      - key: CONFIDENCE_THRESHOLD
        value: "0.75"
      - key: POLYGON_RPC_URL
        value: "https://rpc-amoy.polygon.technology"
      - key: POLYGON_CHAIN_ID
        value: "80002"
      - key: CONTRACT_ADDRESS
        sync: false
      - key: POLYGON_PRIVATE_KEY
        sync: false

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend Next.js 14 Web Service
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: terravault-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: terravault-backend
          property: host

# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL Database Service
# ─────────────────────────────────────────────────────────────────────────────
databases:
  - name: terravault-db
    databaseName: terravault
    user: terravault
    plan: free
    region: oregon
