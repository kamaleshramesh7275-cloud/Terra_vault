# Render Blueprint Specification for Terra_vault (Single Unified Web Service)
# https://render.com/docs/blueprint-spec

version: "1"

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Unified Web Service (Frontend Next.js + Backend FastAPI + Nginx)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: terravault-app
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /docs
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: CONFIDENCE_THRESHOLD
        value: "0.75"
      - key: DATABASE_URL
        fromDatabase:
          name: terravault-db
          property: connectionString
      - key: POLYGON_RPC_URL
        value: "https://rpc-amoy.polygon.technology"
      - key: POLYGON_CHAIN_ID
        value: "80002"
      - key: CONTRACT_ADDRESS
        sync: false
      - key: POLYGON_PRIVATE_KEY
        sync: false

# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL Database Service
# ─────────────────────────────────────────────────────────────────────────────
databases:
  - name: terravault-db
    databaseName: terravault
    user: terravault
    plan: free
    region: oregon
