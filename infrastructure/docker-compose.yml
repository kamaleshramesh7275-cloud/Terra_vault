version: "3.9"

services:
  # ── Databases ─────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.4
    container_name: terravault_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terravault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terravault_secret}
      POSTGRES_DB: ${POSTGRES_DB:-terravault}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terravault"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: terravault_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: terravault_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-terravault}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-terravault_minio_secret}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: terravault_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: terravault_neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/terravault_neo4j}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Backend API ────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: terravault_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-terravault}:${POSTGRES_PASSWORD:-terravault_secret}@postgres:5432/${POSTGRES_DB:-terravault}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-terravault}:${POSTGRES_PASSWORD:-terravault_secret}@postgres:5432/${POSTGRES_DB:-terravault}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-terravault}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-terravault_minio_secret}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-terravault_neo4j}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-https://rpc-amoy.polygon.technology}
      POLYGON_PRIVATE_KEY: ${POLYGON_PRIVATE_KEY:-}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-}
      SECRET_KEY: ${SECRET_KEY:-super_secret_key_change_in_prod}
    volumes:
      - ../ml_models:/app/ml_models
      - ../data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery Workers ─────────────────────────────────────────────
  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: terravault_celery_worker
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-terravault}:${POSTGRES_PASSWORD:-terravault_secret}@postgres:5432/${POSTGRES_DB:-terravault}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-terravault}:${POSTGRES_PASSWORD:-terravault_secret}@postgres:5432/${POSTGRES_DB:-terravault}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-terravault}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-terravault_minio_secret}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-terravault_neo4j}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-https://rpc-amoy.polygon.technology}
      POLYGON_PRIVATE_KEY: ${POLYGON_PRIVATE_KEY:-}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-}
    volumes:
      - ../ml_models:/app/ml_models
      - ../data:/app/data
    depends_on:
      - backend
    restart: unless-stopped

  celery_beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: terravault_celery_beat
    command: celery -A workers.celery_app beat --loglevel=info
    environment:
      REDIS_URL: redis://redis:6379/0
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-terravault}:${POSTGRES_PASSWORD:-terravault_secret}@postgres:5432/${POSTGRES_DB:-terravault}
    depends_on:
      - redis
    restart: unless-stopped

  # ── Frontend ───────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: terravault_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_POLYGON_RPC: ${POLYGON_RPC_URL:-https://rpc-amoy.polygon.technology}
      NEXT_PUBLIC_CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # ── Nginx Reverse Proxy ────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: terravault_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  elasticsearch_data:
  neo4j_data:
  neo4j_logs:
